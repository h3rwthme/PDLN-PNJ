<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Internal PDLN PNJ — Politeknik Negeri Jakarta</title>
  <meta name="description"
    content="Portal internal pra-pengajuan dan verifikasi berkas Perjalanan Dinas Luar Negeri (PDLN) Politeknik Negeri Jakarta.">
  <link rel="icon" type="image/png" href="assets/logo_pnj.png">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/portal.css">
</head>

<body>

  <!-- 1. Top Navbar (Active on User Portal) -->
  <header class="navbar" id="main-navbar">
    <div class="app-container navbar-inner">
      <!-- Institutional Brand with Real PNJ Logo -->
      <a href="?" class="brand">
        <img src="assets/logo_pnj.png" alt="Logo PNJ Resmi" class="brand-logo-img">
        <div class="brand-text">
          <h1>Internal PDLN</h1>
          <p>Kantor Urusan Internasional PNJ</p>
        </div>
      </a>

      <!-- Desktop Navigation Menu Tabs -->
      <nav class="desktop-nav-menu" id="desktop-nav-links">
        <button class="nav-link-btn active" data-view="dashboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          <span>Beranda</span>
        </button>
        <button class="nav-link-btn" data-view="mobility">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z" />
          </svg>
          <span>Catat Mobilitas</span>
        </button>
        <button class="nav-link-btn" id="btn-top-word-template">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </svg>
          <span>Template Dokumen</span>
        </button>
      </nav>

      <!-- Active User Profile & Actions -->
      <div class="nav-actions">
        <!-- Notification Bell Center -->
        <div class="btn-nav-notif-wrap">
          <button class="btn btn-secondary btn-sm btn-icon" id="btn-nav-notif" title="Pemberitahuan Sistem">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="notif-badge-bubble" id="notif-badge-count">0</span>
          </button>
          <div class="notif-drawer-modal" id="notif-drawer" style="display: none;"></div>
        </div>

        <!-- User Profile Button -->
        <button class="user-mini-btn" id="btn-nav-user-profile" title="Klik untuk melihat data profil Anda">
          <div class="user-avatar" id="nav-user-avatar">AP</div>
          <div class="user-info">
            <span class="user-name" id="nav-user-name">Andi Pratama</span>
            <span class="user-role-label" id="nav-user-role">Mahasiswa Aktif</span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            style="color: var(--neutral-400); margin-left: 2px;">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        <button class="btn btn-secondary btn-sm btn-icon" id="btn-nav-logout" title="Keluar Akun">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" x2="9" y1="12" y2="12" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 2. Main Content View Area -->
  <main class="main-wrapper" id="main-content-wrapper">
    <div class="app-container" id="app-portal-container">
      <!-- A. Login / Authentication View -->
      <div id="auth-portal-root" style="display: none;"></div>

      <!-- B. Applicant Portal Root (Mahasiswa / Dosen) -->
      <div id="applicant-portal-root" style="display: none;"></div>

      <!-- C. Mobility Form (Form Catat Orang Keluar & Masuk) -->
      <div id="mobility-portal-root" style="display: none;"></div>

      <!-- E. Pimpinan Internal Portal Root (Direktur / Wadir PNJ) -->
      <div id="pimpinan-portal-root" style="display: none;"></div>
    </div>

    <!-- F. Dedicated KUI Operator & Admin Portal Root (?page=admin) -->
    <div id="kui-portal-root" style="display: none;"></div>
  </main>

  <!-- 3. Mobile Bottom Navigation Bar (Visible on Mobile Screens) -->
  <nav class="mobile-bottom-bar" id="mobile-bottom-bar">
    <button class="mobile-nav-item active" data-nav="home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      </svg>
      <span>Beranda</span>
    </button>
    <button class="mobile-nav-item" data-nav="mobility">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
      <span>Mobilitas</span>
    </button>
    <button class="mobile-nav-item" data-nav="word">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
      </svg>
      <span>Template</span>
    </button>
    <button class="mobile-nav-item" data-nav="profile">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="5" />
        <path d="M20 21a8 8 0 1 0-16 0" />
      </svg>
      <span>Profil</span>
    </button>
  </nav>

  <!-- 4. Hybrid Chatbot Assistant Root -->
  <div id="chatbot-root"></div>

  <!-- 5. Toast Notifications Root -->
  <div id="toast-root" class="toast-container"></div>

  <!-- 6. Institutional Footer -->
  <footer class="app-footer" id="main-footer">
    <div class="app-container">
      <p>
        <strong>Sistem Internal PDLN PNJ</strong> &copy; 2026 Kantor Urusan Internasional Politeknik Negeri Jakarta.<br>
        <span style="font-size: 11px; opacity: 0.75;">Sistem Pelayanan Terpadu Pra-Pengajuan, Verifikasi Kelayakan Berkas, dan Administrasi Perjalanan Dinas Luar Negeri Civitas Academica PNJ.</span>
      </p>
    </div>
  </footer>

  <!-- Core JavaScript Modules (Zero External Dependencies) -->
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/word-template.js"></script>
  <script src="js/mobility-form.js"></script>
  <script src="js/applicant.js"></script>
  <script src="js/pimpinan.js"></script>
  <script src="js/kui.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
